name: Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - '.github/workflows/build-aab.yml'
      - '.github/workflows/gen-keystore.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name tafsirhulm-com --branch main --commit-dirty=true --commit-message="${{ github.event.head_commit.message }}"
