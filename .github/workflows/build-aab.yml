name: Build AAB

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-aab.yml"
  workflow_dispatch:

concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install

      - name: Optimize release size
        run: |
          set -euo pipefail
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          printf '\nandroid.enableMinifyInReleaseBuilds=true\nandroid.enableShrinkResourcesInReleaseBuilds=true\n' >> android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "debugSymbolLevel" not in text:
              needle = "        release {\n"
              if needle not in text:
                  raise SystemExit("release { block not found")
              inject = needle + "            ndk {\n                debugSymbolLevel 'NONE'\n            }\n"
              text = text.replace(needle, inject, 1)
              path.write_text(text)
              print("injected debugSymbolLevel NONE")
          else:
              print("debugSymbolLevel already present")
          PY
          echo "--- gradle.properties ---"
          grep -E 'reactNativeArchitectures|enableMinify|enableShrink' android/gradle.properties

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret — generating a throwaway keystore for this run."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias upload \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=tafsirhulm, OU=app, O=tafsirhulm, L=web, ST=web, C=EG"
            STORE_PASS=android
            KEY_PASS=android
            KEY_ALIAS_VAL=upload
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            KEY_ALIAS_VAL="${KEY_ALIAS:-upload}"
          fi

          BUILD_GRADLE=android/app/build.gradle
          if [ ! -f "$BUILD_GRADLE" ]; then
            BUILD_GRADLE=android/app/build.gradle.kts
          fi

          export BUILD_GRADLE STORE_PASS KEY_PASS KEY_ALIAS_VAL
          python3 - <<'PY'
          import os, re, pathlib

          path = os.environ["BUILD_GRADLE"]
          store_pass = os.environ["STORE_PASS"]
          key_pass = os.environ["KEY_PASS"]
          key_alias = os.environ["KEY_ALIAS_VAL"]
          text = pathlib.Path(path).read_text()

          def find_matching_brace(s, open_pos):
              depth = 0
              for i in range(open_pos, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          def has_release_signing_config(s):
              m = re.search(r"signingConfigs\s*\{", s)
              if not m:
                  return False
              open_pos = m.end() - 1
              close = find_matching_brace(s, open_pos)
              if close < 0:
                  return False
              block = s[open_pos:close + 1]
              return bool(re.search(r"\brelease\s*\{", block))

          release_cfg = (
              "            release {\n"
              '                storeFile file("release.keystore")\n'
              f'                storePassword "{store_pass}"\n'
              f'                keyAlias "{key_alias}"\n'
              f'                keyPassword "{key_pass}"\n'
              "            }\n"
          )

          if not has_release_signing_config(text):
              m = re.search(r"signingConfigs\s*\{", text)
              if not m:
                  block = "    signingConfigs {\n" + release_cfg + "    }\n"
                  if "buildTypes" not in text:
                      raise SystemExit("no buildTypes")
                  text = text.replace("buildTypes", block + "    buildTypes", 1)
                  print("created signingConfigs block")
              else:
                  open_pos = m.end() - 1
                  close = find_matching_brace(text, open_pos)
                  if close < 0:
                      raise SystemExit("unbalanced signingConfigs")
                  text = text[:close] + release_cfg + text[close:]
                  print("inserted release into signingConfigs")
          else:
              print("release signingConfig already present")

          m = re.search(r"buildTypes\s*\{", text)
          if not m:
              raise SystemExit("no buildTypes")
          bt_open = m.end() - 1
          bt_close = find_matching_brace(text, bt_open)
          if bt_close < 0:
              raise SystemExit("unbalanced buildTypes")

          rm = re.search(r"\brelease\s*\{", text[bt_open:bt_close + 1])
          if not rm:
              raise SystemExit("no release in buildTypes")
          rel_open = bt_open + rm.end() - 1
          rel_close = find_matching_brace(text, rel_open)
          if rel_close < 0:
              raise SystemExit("unbalanced release")
          rel_block = text[rel_open:rel_close + 1]

          if "signingConfig signingConfigs.release" not in rel_block:
              if re.search(r"signingConfig\s+signingConfigs\.\w+", rel_block):
                  rel_block = re.sub(
                      r"signingConfig\s+signingConfigs\.\w+",
                      "signingConfig signingConfigs.release",
                      rel_block,
                      count=1,
                  )
              else:
                  rel_block = rel_block.replace(
                      "release {",
                      "release {\n            signingConfig signingConfigs.release",
                      1,
                  )
              text = text[:rel_open] + rel_block + text[rel_close + 1:]
              print("release buildType now uses signingConfigs.release")
          else:
              print("release buildType already correct")

          if not has_release_signing_config(text):
              raise SystemExit("validation: release signingConfig missing")
          m = re.search(r"buildTypes\s*\{", text)
          bt_open = m.end() - 1
          bt_close = find_matching_brace(text, bt_open)
          rm = re.search(r"\brelease\s*\{", text[bt_open:bt_close + 1])
          rel_open = bt_open + rm.end() - 1
          rel_close = find_matching_brace(text, rel_open)
          rel_block = text[rel_open:rel_close + 1]
          if "signingConfig signingConfigs.release" not in rel_block:
              raise SystemExit("validation: release buildType not wired")

          pathlib.Path(path).write_text(text)
          print("patched", path)
          PY

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Collect AAB
        id: aab
        run: |
          set -euo pipefail
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          cp "$AAB" app-release.aab
          ls -lh app-release.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafsirhulm-aab-${{ github.run_number }}
          path: app/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="app-build-${{ github.run_number }}"
          gh release create "$TAG" app-release.aab \
            --repo "${{ github.repository }}" \
            --title "AAB build ${{ github.run_number }}" \
            --notes "Automated Android App Bundle from \`app/\` (commit ${{ github.sha }})." \
            || gh release upload "$TAG" app-release.aab --repo "${{ github.repository }}" --clobber
          gh release view latest-aab --repo "${{ github.repository }}" >/dev/null 2>&1 && \
            gh release upload latest-aab app-release.aab --repo "${{ github.repository }}" --clobber || \
            gh release create latest-aab app-release.aab \
              --repo "${{ github.repository }}" \
              --title "Latest AAB" \
              --notes "Rolling pointer to the most recent successful AAB build." \
              --latest=false
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "Latest:  https://github.com/${{ github.repository }}/releases/tag/latest-aab"
