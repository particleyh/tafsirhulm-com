name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias upload \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass tafsirhulm2026 \
            -keypass tafsirhulm2026 \
            -dname "CN=tafsirhulm, OU=app, O=tafsirhulm, L=web, ST=web, C=EG"
          echo "KEYSTORE_BASE64=$(base64 -w0 release.keystore)" >> "$GITHUB_ENV"
          echo "done"

      - name: Print secrets payload
        run: |
          echo "Set these GitHub secrets on the repo:"
          echo "ANDROID_KEYSTORE_BASE64=$KEYSTORE_BASE64"
          echo "ANDROID_KEYSTORE_PASSWORD=tafsirhulm2026"
          echo "ANDROID_KEY_ALIAS=upload"
          echo "ANDROID_KEY_PASSWORD=tafsirhulm2026"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: release.keystore
          retention-days: 7
